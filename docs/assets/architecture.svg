<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'SF Mono', Monaco, Consolas, 'Courier New', monospace">
  <rect width="900" height="460" fill="#ffffff"/>
  <text font-size="13" fill="#1e293b" xml:space="preserve">
    <tspan x="10" y="25">┌─────────────────────────────────────────────────────────────────┐</tspan>
    <tspan x="10" y="45">│  本地算力机（导师实验室）                                       │</tspan>
    <tspan x="10" y="65">│  - 采集 worker（408 媒体源 RSS + 网页抓取）                     │</tspan>
    <tspan x="10" y="85">│  - NLP worker（bge-m3 embedding、语言检测、情感）               │</tspan>
    <tspan x="10" y="105">│  - 实体抽取 worker（NER + 50 精品种子匹配 + article_entities）  │</tspan>
    <tspan x="10" y="125">│  - 聚类 worker（BERTopic / Agglomerative 全局重聚类）           │</tspan>
    <tspan x="10" y="145">│  - 关系抽取 worker（调云端 LLM API：GLM-4-Flash / SiliconFlow） │</tspan>
    <tspan x="10" y="165">│  - 快照 worker（聚合写 topic/entity/source_snapshots）          │</tspan>
    <tspan x="10" y="185">│  通过公网 PG 连接云服务器读写数据库                              │</tspan>
    <tspan x="10" y="205">└─────────────────────────────────────────────────────────────────┘</tspan>
    <tspan x="10" y="230">                          ↓ PostgreSQL 公网连接（SSL）</tspan>
    <tspan x="10" y="255">┌─────────────────────────────────────────────────────────────────┐</tspan>
    <tspan x="10" y="275">│  阿里云 2C2G/3Mbps（仅 3 个服务）                                │</tspan>
    <tspan x="10" y="295">│  - PostgreSQL 16 + pgvector（数据库存储，~768MB RAM）            │</tspan>
    <tspan x="10" y="315">│  - backend FastAPI（只读 API + JWT/API Key 鉴权，~384MB RAM）    │</tspan>
    <tspan x="10" y="335">│  - frontend nginx（静态文件 + /api 反代 + HTTPS，~64MB RAM）     │</tspan>
    <tspan x="10" y="355">│  不再跑：worker / Redis Stream / ES（全部退役）                  │</tspan>
    <tspan x="10" y="375">└─────────────────────────────────────────────────────────────────┘</tspan>
    <tspan x="10" y="400">                          ↓ HTTPS</tspan>
    <tspan x="10" y="425">┌─────────────────────────────────────────────────────────────────┐</tspan>
    <tspan x="10" y="445">│  用户浏览器 / 数据 API 客户端                                    │</tspan>
    <tspan x="10" y="465">└─────────────────────────────────────────────────────────────────┘</tspan>
  </text>
</svg>
