# PostgreSQL 配置（云端 2C2G 优化 + SSL 启用）
# 用法：postgres -c config_file=/etc/postgresql/postgresql.conf

# ---- 连接 ----
listen_addresses = '*'
max_connections = 30                  # 本地 worker 15 + 云端 backend 15
superuser_reserved_connections = 3

# ---- 内存（2G 服务器，释放 worker 后给 PG 768MB） ----
shared_buffers = 512MB                # 1/4 内存
work_mem = 8MB
maintenance_work_mem = 128MB
effective_cache_size = 1GB
effective_io_concurrency = 16

# ---- SSD 优化 ----
random_page_cost = 1.1

# ---- WAL ----
wal_level = replica
max_wal_size = 512MB
min_wal_size = 128MB
checkpoint_completion_target = 0.9

# ---- 查询规划 ----
default_statistics_target = 100

# ---- 日志（出错排查用，不要太多） ----
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d.log'
log_min_duration_statement = 1000     # 慢查询 >1s 记录
log_line_prefix = '%t [%p]: %q%u@%d '
log_statement = 'none'
log_connections = off
log_disconnections = off

# ---- SSL（强制本地 worker 走加密连接） ----
ssl = on
ssl_cert_file = '/etc/ssl/pg/server.crt'
ssl_key_file = '/etc/ssl/pg/server.key'
ssl_prefer_server_ciphers = on
ssl_min_protocol_version = 'TLSv1.2'

# ---- 时区 ----
timezone = 'UTC'
log_timezone = 'UTC'
