# PostgreSQL 客户端认证配置（云端，支持公网 SSL 访问）
# 用法：postgres -c hba_file=/etc/postgresql/pg_hba.conf
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# 本机（docker 内网）
local   all             all                                     scram-sha-256
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# Docker 内网（backend 用主账号 agenda）
host    agendascope     agenda          172.16.0.0/12           scram-sha-256
host    agendascope     agenda          192.168.0.0/16          scram-sha-256
host    agendascope     agenda          10.0.0.0/8              scram-sha-256

# 公网访问：本地 worker 专用写入账号（强制 SSL）
# agendascope_write 拥有 INSERT/UPDATE/DELETE 权限（articles/article_processing/topic_articles 等）
# 上线前由 DBA 在 psql 中创建：
#   CREATE USER agendascope_write WITH PASSWORD '***强密码***';
#   GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO agendascope_write;
#   GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO agendascope_write;
#   ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO agendascope_write;
hostssl agendascope    agendascope_write    0.0.0.0/0           scram-sha-256

# 公网访问：只读账号（用于备份/调试/BI 工具）
# 上线前由 DBA 在 psql 中创建：
#   CREATE USER agendascope_read WITH PASSWORD '***强密码***';
#   GRANT SELECT ON ALL TABLES IN SCHEMA public TO agendascope_read;
#   ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO agendascope_read;
hostssl agendascope    agendascope_read     0.0.0.0/0           scram-sha-256

# 拒绝其他所有公网连接（默认拒绝）
# host    all             all             0.0.0.0/0               reject
