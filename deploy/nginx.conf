# AgendaScope 观澜 — nginx 生产配置
#
# - 托管前端静态资源（SPA 路由回退到 index.html）
# - 反代 /api 到 backend 容器（backend:8000）
# - HTTPS 443 + HTTP 80 → 301 跳转
# - 证书从 compose 挂载卷 /etc/nginx/certs/ 读取（阿里云 Nginx/PEM 格式：fullchain.pem + key.pem）

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name _;

    # 80 端口只做跳转；health 探针也走 https（若需要 http 直探可放开下面注释）
    return 301 https://$host$request_uri;
}

# HTTPS 主站点
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # 证书（compose 卷挂 deploy/certs → /etc/nginx/certs，只读）
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # gzip：3Mbps 低带宽关键 — 2MB JS 未压缩要 4s（实测），gzip 后 ~600KB 约 1.5s
    # 仅对大体积文本类型启用；JS/CSS/HTML/JSON 是主要收益点
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;             # CPU 2 核有限，6 是压缩率/CPU 平衡
    gzip_min_length 1024;          # 小文件不值得压
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # 前端静态资源（SPA：未匹配到文件的路径回退 index.html，支持前端路由）
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到 backend 容器（compose 网络内服务名 backend:8000）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # 报告导出等长任务放宽超时
        proxy_send_timeout 300s;
        # API 响应短缓存（30s）：浏览器端也复用，切换页面不重复请求。
        # 后端对列表接口已做 Redis 缓存 + 按用户/角色隔离；此处仅提示浏览器可复用，
        # 鉴权响应（401/403）不缓存。
        add_header Cache-Control "private, max-age=30" always;
    }

    # 静态资源缓存（带 hash 的 vite 产物可长缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 健康探针可经 https 访问（/health 在根路径，非 /api 前缀）
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }
}
