# AgendaScope 精简部署 override（适配 2G 低内存服务器）
#
# 用法:
#   docker compose -f deploy/docker-compose.yml -f deploy/compose.deploy.yml up -d
#
# 内存预算（2GB 物理，无 swap 依赖）：
#   PG 384m + Redis 128m + backend 192m + worker(采集) 256m + combined-worker 256m
#   + cluster 512m + frontend 64m = ~1.8GB（ES 关闭，降级走 PG）
#
# 关键决策：
#   - 关 ES：全文搜索降级走 PG（articles 路由已实现 es_unavailable 降级）。
#     实测 ES 8.14 在 2G/2 核下 128m 堆无法启动（GC 死循环 8 分钟未就绪），
#     256m 堆超内存预算会 OOM——2G 硬性跑不动，维持 PG 降级
#   - 合并 worker：nlp/snapshot/detection/naming/agenda 5 进程 → combined-worker 1 进程
#     （线程错峰调度，省 ~500MB 常驻内存）
services:
  # 禁用非核心 worker（不定义则主 compose 的服务仍会启动，这里显式禁用）
  agenda-worker:
    profiles: ["disabled"]
  alerting-worker:
    profiles: ["disabled"]
  rsshub:
    profiles: ["disabled"]   # 无原生 RSS 补源依赖时禁用（避免拉慢镜像源）
  elasticsearch:
    profiles: ["disabled"]   # 低内存：ES 8.14 在 2G/2 核下跑不动（128m 堆 GC 死循环，256m 堆 OOM），搜索走 PG 降级
  # 已合并进 combined-worker，禁用独立进程（否则重复消费 + 内存叠加）
  nlp-worker:
    profiles: ["disabled"]
  snapshot-worker:
    profiles: ["disabled"]
  detection-worker:
    profiles: ["disabled"]
  naming-worker:
    profiles: ["disabled"]

  db:
    mem_limit: 384m
    # 低内存 PG 调优：shared_buffers 128MB（默认 128 但显式）、work_mem 4MB（防排序爆内存）、
    # max_connections 50（2G 内存下每连接 ~10MB，50 连接 = 500MB 上限内）、
    # effective_cache_size 512MB（2G 总内存的 ~1/4）
    command: >
      postgres -c shared_buffers=128MB -c work_mem=4MB -c max_connections=50
      -c effective_cache_size=512MB -c maintenance_work_mem=32MB

  redis:
    mem_limit: 128m

  backend:
    image: agendascope-backend:latest   # 用已 load 的镜像（up 时加 --no-build 跳过 build）
    restart: unless-stopped
    mem_limit: 192m   # 单 worker：2G 内存下 2 workers 每 worker ~100MB 触发 OOM 崩溃
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    restart: unless-stopped
    mem_limit: 256m
    environment:
      CRAWL_TIMEOUT_SECONDS: ${CRAWL_TIMEOUT_SECONDS:-60}   # 低带宽慢源更多机会

  # 合并 worker：单进程跑 nlp/snapshot/detection/naming/agenda（线程错峰）
  combined-worker:
    image: agendascope-backend:latest
    restart: unless-stopped
    mem_limit: 256m
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+psycopg2://agenda:agenda_dev_pwd@db:5432/agendascope
      REDIS_URL: redis://redis:6379/0
      REDIS_STREAM_URL: redis://redis:6379/1
      ELASTICSEARCH_URL: http://elasticsearch:9200
      NLP_MODEL_DIR: /models
      NLP_DEVICE: ${NLP_DEVICE:-cpu}
      NLP_EMBEDDING_PROFILE: ${NLP_EMBEDDING_PROFILE:-api}
      NLP_EMBEDDING_API_BASE_URL: ${NLP_EMBEDDING_API_BASE_URL:-}
      NLP_EMBEDDING_API_KEY: ${NLP_EMBEDDING_API_KEY:-}
      NLP_EMBEDDING_API_MODEL: ${NLP_EMBEDDING_API_MODEL:-text-embedding-3-small}
      # nlp batch 降（低内存防峰值）
      NLP_WORKER_BATCH_SIZE: ${NLP_WORKER_BATCH_SIZE:-8}
      NLP_WORKER_BLOCK_MS: ${NLP_WORKER_BLOCK_MS:-2000}
      # 低内存：跳过 ES 全文索引（搜索走 PG 降级），省 ES 同步内存与重试噪音
      NLP_ES_SYNC_ENABLED: ${NLP_ES_SYNC_ENABLED:-false}
      # LLM 多模型池
      LLM_PROFILE: ${LLM_PROFILE:-api}
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_MODEL: ${LLM_API_MODEL:-qwen-plus}
      LLM_POOL: ${LLM_POOL:-}
      LLM_NAMING_WORKER_BATCH_SIZE: ${LLM_NAMING_WORKER_BATCH_SIZE:-8}
      LLM_NAMING_WORKER_POLL_SECONDS: ${LLM_NAMING_WORKER_POLL_SECONDS:-30}
      # 快照 30min（显著性数据源）
      AGENDA_SNAPSHOT_INTERVAL_MINUTES: ${AGENDA_SNAPSHOT_INTERVAL_MINUTES:-30}
      AGENDA_SNAPSHOT_TIMEOUT_SECONDS: ${AGENDA_SNAPSHOT_TIMEOUT_SECONDS:-300}
    volumes:
      - ../models:/models:ro
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.worker.combined_worker

  cluster-worker:
    restart: unless-stopped
    mem_limit: 512m
    environment:
      # 精度优先：恢复全局重聚类（180min 一轮，校正跨语言议题归并；v1.2.2 验证 2G 能跑，
      # 峰值频率降 3 倍省内存。0=禁用，省峰值但议题归并精度下降）
      CLUSTER_RECLUSTER_INTERVAL_MINUTES: ${CLUSTER_RECLUSTER_INTERVAL_MINUTES:-180}
      # 低内存 2G：关闭 BERTopic 主策略（峰值 ~500MB + 落库超 640m 会 cgroup OOM 杀容器，
      # 实测多次），直接走 Agglomerative（跨语言归并校正仍恢复，精度略降但内存安全）
      CLUSTER_BERTOPIC_ENABLED: ${CLUSTER_BERTOPIC_ENABLED:-false}

  frontend:
    image: agendascope-frontend:latest  # 用已 load 的镜像
    restart: unless-stopped
    mem_limit: 64m    # 静态 nginx，4MB 足够
