# AgendaScope 云端瘦身部署 override（v4.0 分布式架构）
#
# 用法:
#   docker compose -f deploy/docker-compose.yml -f deploy/compose.deploy.yml up -d
#
# v4.0 重大调整：所有 worker 迁移到本地算力机，云端只保留 3 个服务：
#   - db (PostgreSQL + pgvector)：数据库存储，对公网暴露 5432（SSL + 白名单）
#   - backend (FastAPI)：只读 API + JWT/API Key 鉴权
#   - frontend (nginx)：静态文件 + /api 反代 + HTTPS
#
# 内存预算（2GB 物理，预留 ~300MB 宿主余量）：
#   db 768 + backend 384 + frontend 64 = 1216MB（释放 worker 占用的 ~1000MB）
#
# 删除的服务（全部迁移到本地算力机）：
#   worker / nlp-worker / cluster-worker / naming-worker / agenda-worker
#   snapshot-worker / detection-worker / alerting-worker / relation-worker
#   combined-worker / rsshub / elasticsearch
#
# Redis 保留：后端 response_cache / api_cache_middleware 仍需 Redis（30s TTL GET 缓存）
services:

  # ============================================
  # 删除所有 worker（显式禁用，避免主 compose 启动）
  # ============================================
  worker:
    profiles: ["disabled"]
  nlp-worker:
    profiles: ["disabled"]
  cluster-worker:
    profiles: ["disabled"]
  naming-worker:
    profiles: ["disabled"]
  agenda-worker:
    profiles: ["disabled"]
  snapshot-worker:
    profiles: ["disabled"]
  detection-worker:
    profiles: ["disabled"]
  alerting-worker:
    profiles: ["disabled"]
  relation-worker:
    profiles: ["disabled"]
  combined-worker:
    profiles: ["disabled"]
  rsshub:
    profiles: ["disabled"]
  elasticsearch:
    profiles: ["disabled"]

  # ============================================
  # PostgreSQL：公网可达（SSL + 独立账号）
  # ============================================
  db:
    mem_limit: 768m   # 释放 worker 内存后给 PG 更多 shared_buffers
    ports:
      - "5432:5432"   # 公网暴露（宝塔防火墙需配 IP 白名单只放行导师实验室）
    volumes:
      - ../deploy/postgresql/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ../deploy/postgresql/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ../deploy/postgresql/ssl/server.crt:/etc/ssl/pg/server.crt:ro
      - ../deploy/postgresql/ssl/server.key:/etc/ssl/pg/server.key:ro
      - db_data:/var/lib/postgresql/data
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda -d agendascope"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Backend：只读 API + 鉴权（uvicorn 单 worker 省内存）
  # ============================================
  backend:
    image: agendascope-backend:latest
    restart: unless-stopped
    mem_limit: 384m   # 释放 worker 内存后 backend 可以放宽（响应缓存 + 连接池）
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --timeout-keep-alive 5"
    environment:
      # 关闭所有 worker 启动（即便 backend 镜像里有 worker 代码也不启动）
      DISABLE_EMBEDDED_WORKERS: "true"

  # ============================================
  # Redis：保留（response_cache / rate_limit 用）
  # ============================================
  redis:
    mem_limit: 96m

  # ============================================
  # Frontend：nginx 静态 + 反代 + HTTPS
  # ============================================
  frontend:
    image: agendascope-frontend:latest
    restart: unless-stopped
    mem_limit: 64m
