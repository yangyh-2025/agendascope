# AgendaScope 精简部署 override（适配低内存服务器）
#
# 用法:
#   docker compose -f deploy/docker-compose.yml -f deploy/compose.deploy.yml up -d
#
# 仅启用核心链路服务（采集→理解→聚类→命名→前端），停用非核心 worker
# （agenda/snapshot/detection/alerting），并给容器加内存上限防 OOM。
# 内存预算（1.2GB 物理 + 3GB swap）:
#   ES 384m + PG 384m + Redis 128m + backend 192m + worker 256m + nlp 256m + cluster 512m + naming 256m + frontend 64m
services:
  # 禁用非核心 worker（不定义则主 compose 的服务仍会启动，这里显式禁用）
  agenda-worker:
    profiles: ["disabled"]
  snapshot-worker:
    profiles: ["disabled"]
  alerting-worker:
    profiles: ["disabled"]
  rsshub:
    profiles: ["disabled"]   # 无原生 RSS 补源依赖时禁用（避免拉慢镜像源）

  elasticsearch:
    environment:
      ES_JAVA_OPTS: "-Xms192m -Xmx192m"   # 缩减 ES 堆，适配低内存
    mem_limit: 384m

  db:
    mem_limit: 384m

  redis:
    mem_limit: 128m

  backend:
    image: agendascope-backend:latest   # 用已 load 的镜像（up 时加 --no-build 跳过 build）
    restart: unless-stopped
    mem_limit: 192m   # backend 实际用 ~70MB，减额匀给 cluster

  worker:
    restart: unless-stopped
    mem_limit: 256m

  nlp-worker:
    restart: unless-stopped
    mem_limit: 256m

  cluster-worker:
    restart: unless-stopped
    mem_limit: 512m   # 聚类内存密集，加大上限防 Redis 超时

  detection-worker:
    restart: unless-stopped
    mem_limit: 256m   # 实体登记 + 事件检测（本地轻量 NER，LLM 首发判定走云 API）
    environment:
      # LLM API 模式（首发判定/终审走云 API，无需本地 Qwen 权重）
      LLM_PROFILE: ${LLM_PROFILE:-api}
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_MODEL: ${LLM_API_MODEL:-qwen-plus}

  naming-worker:
    restart: unless-stopped
    mem_limit: 256m   # LLM 议题命名（解决"LLM 降级中"标签）
    environment:
      # 讯飞配额（QPS 2/并发 2）+ 引擎自适应限流：batch 8 利用闲时吞吐
      LLM_NAMING_WORKER_BATCH_SIZE: ${LLM_NAMING_WORKER_BATCH_SIZE:-8}
      LLM_NAMING_WORKER_POLL_SECONDS: ${LLM_NAMING_WORKER_POLL_SECONDS:-30}

  frontend:
    image: agendascope-frontend:latest  # 用已 load 的镜像
    restart: unless-stopped
    mem_limit: 64m    # 静态 nginx，4MB 足够
